.orbits{filter:grayscale(1);position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;opacity:.22;animation:spin 160s linear infinite}
.orbits ellipse{fill:none;stroke:var(--gold);stroke-width:.8;stroke-dasharray:3 9}
@keyframes spin{to{transform:rotate(360deg)}}
.hero::after{content:"";z-index:2;position:absolute;inset:0;background:linear-gradient(transparent 62%,var(--bg))}
.mt{position:absolute;z-index:2;left:-3%;bottom:-2px;width:106%;height:70%;pointer-events:none}.ht{position:absolute;z-index:3;inset:0;display:grid;place-content:center;text-align:center}
.ht h1{margin:0;font:italic 700 clamp(44px,9vw,92px)/1 'Cormorant Garamond',serif;color:#fff;text-shadow:0 4px 30px #000}
.ht p{margin:8px 0 0;color:var(--gold)}
.wrap{position:relative;z-index:2;max-width:1160px;margin:-34px auto 0;padding:0 14px 50px}
.grid{display:grid;grid-template-columns:270px 1fr 270px;gap:18px;perspective:1400px}
@media(max-width:940px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{position:relative;background:linear-gradient(150deg,rgba(24,28,32,.8),rgba(10,12,14,.88));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 22px 44px -18px #000,inset 0 1px 0 rgba(255,255,255,.07);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
.card.hot{transition:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(240px circle at var(--gx,50%) var(--gy,0),rgba(190,205,215,.12),transparent 60%);opacity:0;transition:opacity .3s}
.card.hot::after{opacity:1}
h2{font:italic 700 21px 'Cormorant Garamond',serif;color:var(--gold);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;cursor:pointer;color:var(--text);background:rgba(190,205,215,.04);border:1px solid rgba(190,205,215,.28);border-radius:999px;padding:3px 13px;transition:background .2s,transform .15s}
button:hover{background:rgba(190,205,215,.25)}button:active{transform:scale(.94)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.on{background:var(--gold);border-color:var(--gold);color:#0b1014}
.timer{text-align:center}
.ring{position:relative;width:170px;height:170px;margin:4px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
#rp{stroke:var(--gold);stroke-dasharray:440;transition:stroke-dashoffset .3s linear}
.time{position:absolute;inset:0;display:grid;place-content:center;font:700 38px 'Courier Prime',monospace}
.time small{font-size:12px;font-weight:400;color:var(--mute)}
.modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.set{display:none;text-align:left;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.set.open{display:block}
.set label{display:flex;justify-content:space-between;align-items:center;margin:5px 0}
.set input[type=number]{width:64px;font:inherit;color:var(--text);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:8px;padding:2px 6px}
.set input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}
.add{display:flex;gap:6px;margin-bottom:10px}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--text);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.tag{font-size:12px;color:var(--gold);margin:8px 0 2px}
.task{display:flex;gap:8px;align-items:center;padding:3px 0}
.task input{accent-color:var(--gold);width:16px;height:16px}
.task.done span{text-decoration:line-through;color:var(--mute)}
.task span{flex:1;overflow-wrap:anywhere}
.x{border:0;padding:0 6px;color:var(--mute);background:none}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;font-weight:400}
th{color:var(--mute);font-size:12px}
td:first-child{white-space:nowrap;color:var(--mute);width:115px;font-size:13px}
td[contenteditable]:focus{outline:1px solid var(--gold);background:rgba(190,205,215,.08)}
.sched{overflow:auto;max-height:660px}
.quote{font:italic 500 21px/1.4 'Cormorant Garamond',serif}
.habit{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;flex-wrap:wrap}
.days{display:flex;gap:4px}
.days button{width:22px;height:22px;padding:0;border-radius:50%;font-size:10px;border-color:var(--line);color:var(--mute)}
.days button.on{background:var(--gold);border-color:var(--gold);color:#0b1014}
.hw{border-left:3px solid var(--gold);padding-left:10px;margin:8px 0}
.hw b{font:700 18px 'Cormorant Garamond',serif;color:var(--blue)}

#focus.open{display:grid}
#focus .big{font:700 clamp(70px,20vw,180px)/1 'Courier Prime',monospace;color:#fff;}
#focus p{color:var(--gold);font:italic 700 28px 'Cormorant Garamond',serif;margin:0 0 6px}

.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 10px}.bar b{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.wl{color:var(--mute);font-size:13px;margin:0 0 8px}
.rule{display:flex;gap:8px;align-items:center;padding:2px 0}.rule input{accent-color:var(--gold);width:16px;height:16px}.rule span{flex:1}.rule.done span{color:var(--mute);text-decoration:line-through}
.mini{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:6px}.mini input{font:inherit;color:var(--text);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:8px;padding:1px 6px}.mini input[type=number]{width:56px}
.split{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.split div{border:1px solid var(--line);border-radius:8px;padding:3px 2px;text-align:center;font-size:11px;color:var(--mute)}
.split div b{display:block;font-weight:400;font-size:10px}.split div span{color:var(--text);outline:0;display:block;min-height:1.3em;overflow-wrap:anywhere}.split .td{border-color:var(--gold)}.split .dn{background:rgba(190,205,215,.12)}
.wadd{display:grid;grid-template-columns:1fr 54px 54px 62px auto;gap:5px;margin-bottom:8px}@media(max-width:520px){.wadd{grid-template-columns:1fr 1fr 1fr 1fr}.wadd input:first-child{grid-column:1/-1}}
.wadd input{min-width:0;font:inherit;color:var(--text);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.ex{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);font-size:14px}.ex em{color:var(--mute);font-style:normal;font-size:12px}
.red{color:#c5605a}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ht{position:absolute;z-index:5;inset:auto auto 16px 20px;display:block;text-align:left;transform:translateZ(1px);text-shadow:0 2px 14px #000,0 0 3px #000}
.clock{font:700 clamp(36px,7vw,72px)/1 'Courier Prime',monospace;color:#fff;letter-spacing:.02em}.clock small{font-size:.32em;color:var(--gold);margin-left:8px}
.ht p{margin:4px 0 0;font-size:clamp(12px,1.6vw,15px);color:var(--text)}.ht p+p{color:var(--gold)}

</style></head><body>
<canvas id="stars"></canvas>

</div>

</div></div></div>

<script>
const $=id=>document.getElementById(id);
let S={tasks:[{t:'Finish science homework',u:1,d:0},{t:'Call a friend',u:0,d:0}],habits:[{n:'Read 20 pages',d:[]},{n:'Drink water',d:[]}],hw:[{s:'Biology',t:'Chapter 4 notes'}],notes:{},rules:['Cold shower','Workout','10k steps','No sugar','Read 20 pages'],chk:{},split:['Push','Pull','Legs','Grappling','Run','Conditioning','Rest'],wk:[],ws:'',wl:90,cfg:{f:25,s:5,l:15,n:4,a:0,d:1},done:0};
try{const r=localStorage.getItem('orbit-planner');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('orbit-planner',JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' \u00b7 no days off';

/* snow + parallax */
const cv=$('stars'),c=cv.getContext('2d');let St=[],mx=0,my=0,cx=0,cy=0;
function rs(){cv.width=innerWidth;cv.height=innerHeight;St=Array.from({length:Math.min(110,innerWidth/10)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.8+.5,v:Math.random()*.7+.25,a:Math.random()*6}))}
rs();addEventListener('resize',rs);
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
(function f(){cx+=(mx-cx)*.06;cy+=(my-cy)*.06;c.clearRect(0,0,cv.width,cv.height);
St.forEach(s=>{s.a+=.012;s.y+=s.v*(1+s.r*.3);s.x+=Math.sin(s.a)*.35-.25-cx*.5;if(s.y>cv.height+5){s.y=-5;s.x=Math.random()*cv.width}if(s.x<-5)s.x=cv.width+5;if(s.x>cv.width+5)s.x=-5;c.fillStyle=`rgba(230,238,244,${.1+s.r*.1})`;c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()});
$('bg').style.transform=`perspective(900px) translate3d(${-cx*36}px,${-cy*18+Math.min(scrollY,400)*.2}px,0) rotateY(${cx*3}deg) rotateX(${-cy*3}deg)`;const sr=$('strip').getBoundingClientRect();$('sb').style.transform=`translateY(${(sr.top-innerHeight/2)*-.07}px)`;requestAnimationFrame(f)})();
if(matchMedia('(hover:hover)').matches)document.querySelectorAll('.card').forEach(k=>{
k.addEventListener('pointermove',e=>{const r=k.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;k.classList.add('hot');k.style.setProperty('--ry',(x-.5)*7+'deg');k.style.setProperty('--rx',(.5-y)*7+'deg');k.style.setProperty('--gx',x*100+'%');k.style.setProperty('--gy',y*100+'%')});
k.addEventListener('pointerleave',()=>{k.classList.remove('hot');k.style.setProperty('--rx','0deg');k.style.setProperty('--ry','0deg')})});

addEventListener('pointermove',e=>{const r=$('hero').getBoundingClientRect(),s=$('spot').style;s.setProperty('--sx',(e.clientX-r.left)+'px');s.setProperty('--sy',(e.clientY-r.top)+'px')});
function clk(){const d=new Date();$('clock').innerHTML=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})+'<small>'+String(d.getSeconds()).padStart(2,'0')+'</small>'}setInterval(clk,1000);clk();
/* pomodoro */
const N={f:'Focus',s:'Short break',l:'Long break'};let ph='f',left=S.cfg.f*60,total=left,run=false,endAt=0,iv=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function beep(){if(!S.cfg.d)return;try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=660+t*400;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.2);o.start(a.currentTime+t);o.stop(a.currentTime+t+.22)})}catch(e){}}
function draw(){const t=fmt(left);$('time').textContent=t;$('ft').textContent=t;$('fph').textContent=N[ph];$('rp').style.strokeDashoffset=440*(1-left/total);$('go').textContent=run?'Pause':'Start';$('fgo').textContent=run?'Pause':'Resume';
$('rounds').textContent=N[ph]+' · round '+(S.done%S.cfg.n+(ph=='f'?1:0))+'/'+S.cfg.n;$('streak').textContent=S.done+' focus rounds';document.title=(run?t+' · ':'')+'Orbit';
$('modes').innerHTML=Object.keys(N).map(k=>`<button class="${k==ph?'on':''}" data-m="${k}">${N[k]}</button>`).join('')}
function setPh(p,start){clearInterval(iv);ph=p;left=total=S.cfg[p]*60;run=false;draw();if(start)go()}
function go(){if(run){clearInterval(iv);run=false;left=Math.max(0,Math.ceil((endAt-Date.now())/1000))}else{run=true;endAt=Date.now()+left*1000;iv=setInterval(tick,250)}draw()}
function tick(){left=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(left<=0){clearInterval(iv);run=false;beep();next(true)}draw()}
function next(fin){if(ph=='f'&&fin){S.done++;save()}setPh(ph=='f'?(S.done%S.cfg.n==0?'l':'s'):'f',S.cfg.a&&fin)}
$('modes').onclick=e=>{const m=e.target.dataset.m;if(m)setPh(m)};
$('go').onclick=go;$('fgo').onclick=go;$('reset').onclick=()=>setPh(ph);$('skip').onclick=()=>next(false);
$('fm').onclick=()=>{$('focus').classList.add('open');if(!run&&ph=='f')go()};$('fx').onclick=()=>$('focus').classList.remove('open');
$('gear').onclick=()=>$('set').classList.toggle('open');
const ids={cf:'f',cs:'s',cl:'l',cn:'n'};
Object.entries(ids).forEach(([id,k])=>{$(id).value=S.cfg[k];$(id).onchange=e=>{const mx={f:180,s:60,l:90,n:12},mn=k=='n'?2:1;let v=Math.round(+e.target.value)||S.cfg[k];v=Math.min(mx[k],Math.max(mn,v));e.target.value=v;S.cfg[k]=v;save();if(!run&&k==(ph=='n'?'':ph))setPh(ph);else if(!run){draw()}}});
$('ca').checked=!!S.cfg.a;$('cd').checked=!!S.cfg.d;$('ca').onchange=e=>{S.cfg.a=+e.target.checked;save()};$('cd').onchange=e=>{S.cfg.d=+e.target.checked;save()};
setPh('f');

/* tasks */
function tasks(){const g=u=>S.tasks.map((x,i)=>[x,i]).filter(([x])=>!!x.u==u).map(([x,i])=>`<div class="task ${x.d?'done':''}"><input type="checkbox" ${x.d?'checked':''} data-c="${i}" aria-label="Done"><span>${esc(x.t)}</span><button class="x" data-x="${i}" aria-label="Remove">×</button></div>`).join('');
$('tasks').innerHTML=`<div class="tag">urgent</div>${g(1)||'<div style="color:var(--mute)">Nothing urgent.</div>'}<div class="tag" style="color:var(--blue)">regular</div>${g(0)||'<div style="color:var(--mute)">Add something small.</div>'}`}
$('tasks').onclick=e=>{const d=e.target.dataset;if(d.c!=null)S.tasks[d.c].d=e.target.checked?1:0;else if(d.x!=null)S.tasks.splice(d.x,1);else return;save();tasks()};
const addT=u=>{const v=$('tin').value.trim();if(!v)return;S.tasks.push({t:v,u,d:0});$('tin').value='';save();tasks()};
$('ta').onclick=()=>addT(0);$('tu').onclick=()=>addT(1);$('tin').onkeydown=e=>{if(e.key=='Enter')addT(0)};tasks();
const p2=n=>String(n).padStart(2,'0');
$('sched').innerHTML=Array.from({length:16},(_,i)=>`<tr><td>${p2(i+6)}:00 – ${p2(i+7)}:00</td><td contenteditable data-k="e${i}">${esc(S.notes['e'+i]||'')}</td><td contenteditable data-k="n${i}">${esc(S.notes['n'+i]||'')}</td></tr>`).join('');
$('sched').oninput=e=>{S.notes[e.target.dataset.k]=e.target.textContent;save()};
const Q=['Cold mornings are where the season is won.','Do the hard thing first. The rest of the day gets lighter.','The mountains don\u2019t care about your mood. Train anyway.','Discipline is a promise you keep when nobody is watching.','You don\u2019t need motivation. You need the next 25 minutes.','Comfort is a slow leak. Pick the harder path today.'];
let qi=new Date().getDate()%Q.length;const q=()=>$('quote').textContent='\u201C'+Q[qi]+'\u201D';$('nq').onclick=()=>{qi=(qi+1)%Q.length;q()};q();
const D=['M','T','W','T','F','S','S'];
function habits(){$('habits').innerHTML=S.habits.map((h,i)=>`<div class="habit"><span>${esc(h.n)}</span><span class="days">${D.map((d,j)=>`<button class="${h.d.includes(j)?'on':''}" data-h="${i}" data-j="${j}" aria-label="${d}">${d}</button>`).join('')}</span></div>`).join('')}
$('habits').onclick=e=>{const d=e.target.dataset;if(d.h==null)return;const a=S.habits[d.h].d,j=+d.j,k=a.indexOf(j);k<0?a.push(j):a.splice(k,1);save();habits()};
$('ha').onclick=()=>{const v=$('hin').value.trim();if(!v)return;S.habits.push({n:v,d:[]});$('hin').value='';save();habits()};habits();
function hw(){$('hw').innerHTML=S.hw.map((h,i)=>`<div class="hw"><b>${esc(h.s||'General')}</b><br>${esc(h.t)} <button class="x" data-x="${i}" aria-label="Remove">×</button></div>`).join('')||'<div style="color:var(--mute)">No homework. Clear skies.</div>'}
$('hw').onclick=e=>{if(e.target.dataset.x==null)return;S.hw.splice(e.target.dataset.x,1);save();hw()};
$('hb').onclick=()=>{const v=$('hin2').value.trim();if(!v)return;S.hw.push({s:$('hsub').value.trim(),t:v});$('hin2').value='';$('hsub').value='';save();hw()};hw();

/* winter arc + workout */
const dk=d=>new Date(d).toLocaleDateString('en-CA'),today=()=>dk(Date.now());
if(!S.ws){S.ws=today();save()}
const WQ=['Cold, dark, early. Do it anyway.','Wrestlers train in the cold and the dark. So do you.','Ninety days of no excuses.','Be harder to break than the winter.'];
function arc(){const n=Math.max(1,Math.floor((new Date(today())-new Date(S.ws))/864e5)+1),L=S.wl;$('wday').textContent='day '+Math.min(n,L)+' / '+L;$('hday').textContent='winter arc \u00b7 day '+Math.min(n,L)+' of '+L;$('wbar').style.width=Math.min(100,n/L*100)+'%';$('wq').textContent=WQ[n%WQ.length];$('wstart').value=S.ws;$('wlen').value=L;
const k=S.chk[today()]||[];$('rules').innerHTML=S.rules.map((r,i)=>`<div class="rule ${k.includes(i)?'done':''}"><input type="checkbox" data-r="${i}" ${k.includes(i)?'checked':''} aria-label="${esc(r)}"><span>${esc(r)}</span><button class="x" data-rx="${i}" aria-label="Remove">×</button></div>`).join('')+`<div class="wl" style="margin:6px 0 0">${k.length}/${S.rules.length} done today</div>`}
$('rules').onclick=e=>{const d=e.target.dataset;if(d.r!=null){const a=S.chk[today()]=S.chk[today()]||[],i=+d.r,j=a.indexOf(i);j<0?a.push(i):a.splice(j,1)}else if(d.rx!=null){S.rules.splice(d.rx,1);S.chk[today()]=[]}else return;save();arc()};
$('ra').onclick=()=>{const v=$('rin').value.trim();if(!v)return;S.rules.push(v);$('rin').value='';save();arc()};
$('wstart').onchange=e=>{if(e.target.value){S.ws=e.target.value;save();arc()}};$('wlen').onchange=e=>{S.wl=Math.min(365,Math.max(7,+e.target.value||90));save();arc()};arc();
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function wk(){const t=today(),dow=(new Date().getDay()+6)%7,mon=new Date();mon.setDate(mon.getDate()-dow);
$('split').innerHTML=DN.map((d,i)=>{const dt=new Date(mon);dt.setDate(mon.getDate()+i);const key=dk(dt),did=S.wk.some(w=>w.d==key);return`<div class="${i==dow?'td':''} ${did?'dn':''}"><b>${d}</b><span contenteditable data-s="${i}">${esc(S.split[i])}</span></div>`}).join('');
const L=S.wk.filter(w=>w.d==t),vol=L.reduce((a,w)=>a+w.s*w.r*w.k,0),pr={};S.wk.forEach(w=>{pr[w.x]=Math.max(pr[w.x]||0,w.k)});
const wkDays=new Set(S.wk.filter(w=>(new Date(t)-new Date(w.d))/864e5<7).map(w=>w.d)).size;
$('wsum').textContent=wkDays+' sessions this week \u00b7 '+vol+' kg today';
$('wlog').innerHTML=L.map(w=>`<div class="ex"><span>${esc(w.x)} <em>${w.s}\u00d7${w.r}${w.k?' @ '+w.k+'kg':''}${w.k&&w.k==pr[w.x]&&w.k>0?' \u00b7 PR':''}</em></span><button class="x" data-wx="${S.wk.indexOf(w)}" aria-label="Remove">\u00d7</button></div>`).join('')||'<div class="wl">Nothing logged today. Go earn it.</div>'}
$('split').oninput=e=>{if(e.target.dataset.s!=null){S.split[e.target.dataset.s]=e.target.textContent;save()}};
$('wlog').onclick=e=>{if(e.target.dataset.wx==null)return;S.wk.splice(e.target.dataset.wx,1);save();wk()};
$('wa').onclick=()=>{const x=$('wx').value.trim();if(!x)return;S.wk.push({d:today(),x,s:+$('ws').value||1,r:+$('wr').value||1,k:+$('wk').value||0});['wx','ws','wr','wk'].forEach(i=>$(i).value='');save();wk()};wk();
</script><script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
